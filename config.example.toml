# Sink Configuration Example
# Copy to /etc/sink/config.toml and fill in your values

[bluebubbles]
host = "your-bluebubbles-host"  # Hostname or IP of BlueBubbles server
port = 1234                      # BlueBubbles port
password = "your-password"       # BlueBubbles password

# Optional: read-only BlueBubbles instance for resolving sender handles to contact
# names. Use this when the messaging account has no Contacts access but another
# account/instance does. host/password default to [bluebubbles] when omitted.
# [contacts]
# enabled = true
# port = 1234
# host = "your-bluebubbles-host"
# password = "your-password"

[claude]
working_dir = "/path/to/working/directory"  # Directory Claude runs in
binary = "/path/to/claude"                   # Path to claude CLI binary

[polling]
interval_secs = 5              # How often to poll for new messages
batch_window_secs = 30         # Wait this long for additional messages before processing

[database]
path = "/var/lib/sink/messages.db"

[context]
message_history_count = 20  # Number of previous messages to include as context

# Optional: inject messages into a persistent interactive agent in tmux.
# When restart_command is set, sink respawns this pane at daemon startup.
# It runs through interactive Bash so ~/.bash_aliases functions are available.
# [tmux]
# window = "sink MASTER"
# restart_command = "codex --yolo"
# prompt = "›"
# timeout_secs = 300
# extended_timeout_secs = 600
# capture_lines = 200
# capture_interval_ms = 200

# Optional: For group chat filtering
# If not set, all group chat messages will be processed
[gemini]
api_key = ""  # Or set GEMINI_API_KEY environment variable
model = "gemini-2.0-flash"

# Optional: Proactive notifications
[notifications]
enabled = false
scheduler_interval_secs = 60

# Optional: Web admin panel
[web_server]
enabled = true
port = 1111
host = "0.0.0.0"  # Use 127.0.0.1 to restrict to localhost

# Optional: Gmail integration (for email-related features)
# [gmail]
# account = "you@gmail.com"           # Gmail account to manage
# owner_chat_guid = "iMessage;-;+15551234567"  # iMessage chat GUID to send auth prompts to
# cli_path = "/usr/local/bin/gmail-cli"        # Path to gmail-cli binary
